# ==============================================================================
# Nginx Hardened Configuration for Single Page Application (SPA)
# Proyecto Vitraglass - Despliegue en Contenedores (Semana 18 UTP)
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # --------------------------------------------------------------------------
    # Cabeceras de Seguridad HTTP (Hardening OWASP)
    # --------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --------------------------------------------------------------------------
    # Compresión Gzip para alto rendimiento en transferencia
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # --------------------------------------------------------------------------
    # Endpoint de Sondeo de Salud (Healthcheck)
    # Utilizado por Docker Engine, Kubernetes probes y Docker Compose
    # --------------------------------------------------------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # --------------------------------------------------------------------------
    # Caché inmutable para activos estáticos (Vite genera hashes únicos)
    # --------------------------------------------------------------------------
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # Enrutamiento React Router SPA (Fallback a index.html)
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------------------------------
    # Páginas de error personalizadas
    # --------------------------------------------------------------------------
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
