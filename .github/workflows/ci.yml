name: Integración Continua - Frontend VitraGlass
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verificacion:
    name: Pruebas y compilación
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar pruebas automatizadas
        run: npm test
      - name: Compilar aplicación
        run: npm run build